<!DOCTYPE html>

<html lang="ru">

<head>
    <meta charset="utf-8">
    <title>Pixel Indie Site — Яндекс карта</title>

    <script src="https://api-maps.yandex.ru/2.1/?lang=ru_RU&apikey=56880a29-acc8-4d56-a893-833ff0175a27" type="text/javascript"></script>

    <script>
        ymaps.ready(init);

        function init() {
            var map = new ymaps.Map("map", {
                center: [48.012015, 37.882214], // Центр карты
                zoom: 1
            });

            // Создаем маршрут
            var multiRoute = new ymaps.multiRouter.MultiRoute({
                referencePoints: [
                    [47.969465, 37.924104], // Школа
                    [47.994061, 37.804125] // ДонНТУ
                ],
                params: {
                    results: 1, // Устанавливаем количество маршрутов
                    routingMode: 'driving'
                }
            }, {
                boundsAutoApply: true // Автоматически подстраивать границы карты
            });

            // Добавляем маршрут на карту
            map.geoObjects.add(multiRoute);
        }
    </script>
